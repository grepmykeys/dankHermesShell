name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check helper is executable
        run: test -x bin/dank-hermes-shell

      - name: Check plugin.json is valid JSON
        run: python3 -c "import json; json.load(open('plugin.json'))"

  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 declarative tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qt6-tools-dev-tools qml6-module-qtquick

      - name: Lint QML (best effort — qs.* imports are not resolvable outside DMS)
        run: |
          shopt -s globstar
          qmllint6 --ignore-settings -W1 *.qml components/*.qml || true
